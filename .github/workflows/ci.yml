name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SignalSort.sln

      - name: Build solution (Release)
        run: dotnet build SignalSort.sln -c Release --nologo

      - name: Run tests
        run: dotnet test SignalSort.sln -c Release --nologo --no-build
